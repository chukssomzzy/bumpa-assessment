services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bumpa
      POSTGRES_PASSWORD: bumpa
      POSTGRES_DB: bumpa
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bumpa -d bumpa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds definitions, then exits. Both app
  # services wait for it to complete, so boot order is explicit rather than racy.
  migrate:
    build: { context: ., target: runtime }
    command: ['node', 'dist/database/migrate']
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://bumpa:bumpa@postgres:5432/bumpa
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., target: runtime }
    command: ['node', 'dist/main']
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://bumpa:bumpa@postgres:5432/bumpa
      REDIS_URL: redis://redis:6379
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Same image, different command. The API's module graph excludes the queue
  # processors, so only this service consumes jobs.
  worker:
    build: { context: ., target: runtime }
    command: ['node', 'dist/main.worker']
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://bumpa:bumpa@postgres:5432/bumpa
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
