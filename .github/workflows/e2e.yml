name: E2E

# Manual only: needs real provider credentials and takes minutes rather than seconds.
#
# The webhook spec additionally needs the `tunnel` profile and a Cloudflare named
# tunnel whose hostname is registered as the TEST-MODE webhook URL in the Paystack
# dashboard, with OTP-for-transfers disabled. Without CLOUDFLARE_TUNNEL_TOKEN the
# tunnel-preflight container fails the `up` by design, naming the missing variable.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialise .env from secrets
        run: |
          cp .env.example .env
          sed -i "s|^WEBHOOK_SECRET=.*|WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}|" .env
          sed -i "s|^PAYSTACK_SECRET_KEY=.*|PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}|" .env
          sed -i "s|^PAYMENT_PROVIDER=.*|PAYMENT_PROVIDER=paystack|" .env
          sed -i "s|^CLOUDFLARE_TUNNEL_TOKEN=.*|CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}|" .env
      - run: docker compose --profile tunnel up -d --wait
      - run: npm run test:e2e
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          API_URL: http://localhost:3000
      - if: always()
        run: docker compose --profile tunnel logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
