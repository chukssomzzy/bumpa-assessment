# Reusable: builds the `runtime` stage of the Dockerfile and optionally pushes it
# to GHCR. Callers pass `push: false` to verify the build (PRs, every push) and
# `push: true` with real tags once tests have gone green (staging, release tags).
name: Publish Image

on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated list of full image refs, e.g. `ghcr.io/owner/repo:tag`.
        required: true
        type: string
      push:
        description: Push the built image to GHCR.
        required: false
        type: boolean
        default: false

# A reusable workflow cannot exceed the permissions its caller job grants, so
# every caller must declare this same block too.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on build-only (unauthenticated PR) runs — nothing is pushed,
        # so there is nothing to authenticate for.
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          tags: ${{ inputs.tags }}
          push: ${{ inputs.push }}
          cache-from: type=registry,ref=ghcr.io/chukssomzzy/bumpa-assessment:buildcache
          # cache-to WRITES to the registry, so it needs the same auth as the
          # image push itself — skip it whenever this run isn't pushing, or the
          # step fails against an unauthenticated registry on every PR build.
          cache-to: ${{ inputs.push && 'type=registry,ref=ghcr.io/chukssomzzy/bumpa-assessment:buildcache,mode=max' || '' }}
